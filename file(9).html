<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آزمون جمع و تفریق بردارها | ریاضی هفتم</title>

  <style>
    body {
      font-family: Tahoma, sans-serif;
      max-width: 850px;
      margin: 24px auto;
      padding: 16px;
      color: #202938;
      background: #f4f7fb;
      line-height: 1.9;
    }

    main {
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0001;
    }

    h1, h2 { color: #174b78; }
    .teacher { color: #555; }

    .video {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      margin: 16px 0;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .question, .lesson {
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #dce4ee;
      border-radius: 10px;
    }

    .lesson { background: #fff8df; }
    label { display: block; margin: 5px 0; }

    input[type="text"] {
      width: min(100%, 360px);
      padding: 10px;
      border: 1px solid #aab7c6;
      border-radius: 7px;
      font: inherit;
    }

    button {
      margin-top: 16px;
      padding: 11px 20px;
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      background: #8999a8;
      cursor: not-allowed;
    }

    #result { margin-top: 22px; }
    .hidden { display: none; }
  </style>
</head>

<body>
  <main>
    <h1>آزمون جمع و تفریق بردارها</h1>
    <p class="teacher">دبیر: آقای زینال‌نژاد | ریاضی هفتم، فصل دوم</p>

    <label for="studentName">نام و نام خانوادگی دانش‌آموز:</label>
    <input
      id="studentName"
      type="text"
      placeholder="نام خود را بنویسید"
      autocomplete="name"
    >

    <h2>۱. فیلم آموزشی</h2>
    <p>ابتدا فیلم را ببینید؛ سپس گزینهٔ «فیلم را دیدم» را علامت بزنید.</p>

    <div class="video">
      <iframe
        src="https://www.aparat.com/video/video/embed/videohash/wnx1qy0/vt/frame"
        title="فیلم آموزشی جمع و تفریق بردارها"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <label>
      <input id="watched" type="checkbox">
      فیلم را دیدم.
    </label>

    <h2>۲. پرسش‌ها</h2>
    <form id="quiz"></form>

    <button id="submitBtn" type="button" disabled>
      ثبت پاسخ‌ها و دیدن کارنامه
    </button>

    <section id="result" class="hidden" aria-live="polite"></section>
  </main>

  <script>
    const questions = [
      {
        text: "۱) بردار را چگونه می‌توان توصیف کرد؟",
        options: [
          "فقط با یک عدد",
          "با اندازه و جهت",
          "فقط با رنگ",
          "با نام یک شکل"
        ],
        answer: 1,
        topic: "meaning"
      },
      {
        text: "۲) اگر دو بردار هم‌جهت و هم‌اندازه باشند، اندازهٔ برآیند آن‌ها چه می‌شود؟",
        options: [
          "صفر",
          "برابر اندازهٔ یکی از آن‌ها",
          "دو برابر اندازهٔ یکی از آن‌ها",
          "نصف اندازهٔ یکی از آن‌ها"
        ],
        answer: 2,
        topic: "same"
      },
      {
        text: "۳) دو بردار ۳ و ۵ واحدی در یک راستا و هم‌جهت‌اند. اندازهٔ برآیند چند واحد است؟",
        options: ["۲", "۸", "۱۵", "۰"],
        answer: 1,
        topic: "same"
      },
      {
        text: "۴) دو بردار ۷ و ۴ واحدی در یک راستا و خلاف‌جهت‌اند. اندازهٔ برآیند چند واحد است؟",
        options: ["۱۱", "۲۸", "۳", "۰"],
        answer: 2,
        topic: "opposite"
      },
      {
        text: "۵) بردار مخالف یک بردار، از نظر اندازه و جهت چه ویژگی‌ای دارد؟",
        options: [
          "هم‌اندازه و هم‌جهت است",
          "اندازه‌اش نصف و جهتش مخالف است",
          "هم‌اندازه و خلاف‌جهت است",
          "اندازه‌اش دو برابر و هم‌جهت است"
        ],
        answer: 2,
        topic: "opposite"
      },
      {
        text: "۶) جمع یک بردار با بردار مخالف خودش برابر است با:",
        options: [
          "دو برابر آن بردار",
          "بردار صفر",
          "یک بردار هم‌اندازه",
          "قابل محاسبه نیست"
        ],
        answer: 1,
        topic: "zero"
      },
      {
        text: "۷) برای به‌دست‌آوردن A − B، کدام عبارت درست است؟",
        options: [
          "A را با B جمع می‌کنیم",
          "A را با بردار مخالف B جمع می‌کنیم",
          "B را از نظر اندازه نصف می‌کنیم",
          "جهت A را تغییر می‌دهیم"
        ],
        answer: 1,
        topic: "subtract"
      },
      {
        text: "۸) اگر A برابر ۶ واحد به راست و B برابر ۲ واحد به راست باشد، A − B چیست؟",
        options: [
          "۸ واحد به راست",
          "۴ واحد به راست",
          "۴ واحد به چپ",
          "۸ واحد به چپ"
        ],
        answer: 1,
        topic: "subtract"
      },
      {
        text: "۹) اگر برداری ۵ واحد به راست باشد، بردار مخالف آن کدام است؟",
        options: [
          "۵ واحد به راست",
          "۵ واحد به چپ",
          "۱۰ واحد به راست",
          "بردار صفر"
        ],
        answer: 1,
        topic: "direction"
      },
      {
        text: "۱۰) دو بردار ۴ واحدی در یک راستا و خلاف‌جهت‌اند. برآیند آن‌ها چیست؟",
        options: [
          "۸ واحد در جهت بردار اول",
          "۴ واحد در جهت بردار دوم",
          "بردار صفر",
          "۸ واحد در جهت بردار دوم"
        ],
        answer: 2,
        topic: "zero"
      }
    ];

    const lessons = {
      meaning:
        "بردار کمیتی است که هم اندازه دارد و هم جهت. برای نمایش آن معمولاً از پیکان استفاده می‌کنیم.",

      same:
        "در جمع دو بردار هم‌راستا و هم‌جهت، اندازه‌ها را با هم جمع می‌کنیم و جهت برآیند همان جهت بردارهاست.",

      opposite:
        "برای دو بردار هم‌راستا و خلاف‌جهت، اندازهٔ کوچک‌تر را از بزرگ‌تر کم می‌کنیم. جهت برآیند، جهت بردار بزرگ‌تر است.",

      zero:
        "دو بردار هم‌اندازه و خلاف‌جهت یکدیگر را خنثی می‌کنند؛ برآیند آن‌ها بردار صفر است.",

      subtract:
        "تفریق برداری را به جمع تبدیل می‌کنیم: A − B = A + (−B). یعنی ابتدا جهت B را برعکس می‌کنیم.",

      direction:
        "بردار مخالف، اندازهٔ برابر و جهت مخالف دارد؛ مثلاً مخالفِ ۵ واحد به راست، ۵ واحد به چپ است."
    };

    const form = document.getElementById("quiz");

    questions.forEach((question, index) => {
      const fieldset = document.createElement("fieldset");
      fieldset.className = "question";

      const optionsHTML = question.options.map((option, optionIndex) => `
        <label>
          <input
            type="radio"
            name="q${index}"
            value="${optionIndex}"
          >
          ${option}
        </label>
      `).join("");

      fieldset.innerHTML = `
        <legend>${question.text}</legend>
        ${optionsHTML}
      `;

      form.appendChild(fieldset);
    });

    const nameInput = document.getElementById("studentName");
    const watched = document.getElementById("watched");
    const submitBtn = document.getElementById("submitBtn");

    function updateButton() {
      const hasName = nameInput.value.trim().length > 0;
      const hasWatchedVideo = watched.checked;
      const hasAnsweredAll = questions.every((_, index) =>
        form.querySelector(`input[name="q${index}"]:checked`)
      );

      submitBtn.disabled = !(hasName && hasWatchedVideo && hasAnsweredAll);
    }

    nameInput.addEventListener("input", updateButton);
    watched.addEventListener("change", updateButton);
    form.addEventListener("change", updateButton);

    submitBtn.addEventListener("click", () => {
      let score = 0;
      const weakTopics = new Set();
      let details = "";

      questions.forEach((question, index) => {
        const selectedAnswer = Number(
          form.querySelector(`input[name="q${index}"]:checked`).value
        );

        if (selectedAnswer === question.answer) {
          score++;
          details += `<p>سؤال ${index + 1}: درست ✅</p>`;
        } else {
          weakTopics.add(question.topic);
          details += `
            <p>
              سؤال ${index + 1}: نادرست ❌
              پاسخ درست: ${question.options[question.answer]}
            </p>
          `;
        }
      });

      const percent = score * 10;
      let status;

      if (percent >= 80) {
        status = "عالی";
      } else if (percent >= 60) {
        status = "خوب";
      } else {
        status = "نیازمند تمرین";
      }

      const lessonsHTML = weakTopics.size > 0
        ? [...weakTopics]
            .map(topic => `<div class="lesson">${lessons[topic]}</div>`)
            .join("")
        : "<p>همهٔ پاسخ‌ها درست است؛ آفرین!</p>";

      const result = document.getElementById("result");

      result.innerHTML = `
        <h2>کارنامهٔ ${nameInput.value.trim()}</h2>
        <p>نمره: ${score} از ۱۰ (${percent}٪) — وضعیت: ${status}</p>
        <h3>بررسی پاسخ‌ها</h3>
        ${details}
        <h3>درسنامهٔ بخش‌هایی که نیاز به تمرین دارند</h3>
        ${lessonsHTML}
      `;

      result.classList.remove("hidden");
      result.scrollIntoView({ behavior: "smooth" });
    });
  </script>
</body>
</html>
